{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Smart HRMS{% endblock %}</title>

    <!-- Theme Initialization Script (Prevents Theme Flash / FOUC) -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("smart_hr_theme");
          var theme = (savedTheme === "dark" || savedTheme === "light") ? savedTheme : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.setAttribute("data-bs-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.setAttribute("data-bs-theme", "light");
        }
      })();
    </script>

    <!-- Inter Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Centralized Smart HR Design System (Light & Dark Mode) -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=3.0.0">

    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block nav %}{% endblock %}

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}?v=3.0.0"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
