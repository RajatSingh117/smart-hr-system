{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart HRMS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; min-height: 100vh; }
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { width: 100%; max-width: 420px; border: none; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .login-header { background: linear-gradient(135deg, #166534 0%, #14532d 100%); color: white; border-radius: 16px 16px 0 0; padding: 40px 30px 30px; text-align: center; }
        .login-body { padding: 40px 30px; }
        .form-control { border-radius: 8px; padding: 12px 16px; border: 1px solid #d1d5db; }
        .form-control:focus { border-color: #166534; box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.15); }
        .btn-primary { background: #166534; border: none; border-radius: 8px; padding: 12px; font-weight: 600; }
        .btn-primary:hover { background: #14532d; }
        .form-check-input:checked { background: #166534; border-color: #166534; }
        .alert { border-radius: 8px; border: none; }
        .divider { display: flex; align-items: center; gap: 16px; margin: 24px 0; color: #6b7280; font-size: 0.875rem; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
    </style>
</head>
<body>
    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
