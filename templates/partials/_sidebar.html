<aside class="hr-sidebar" id="hr-sidebar">
  <ul class="nav flex-column">
    {% for item in menu_items %}
      <li class="nav-item">
        <a class="nav-link{% if item.active %} active{% endif %}" href="{{ item.url }}">
          <span class="me-2">{{ item.icon }}</span>{{ item.label }}
        </a>
      </li>
    {% endfor %}
  </ul>
</aside>
