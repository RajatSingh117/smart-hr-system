<nav class="navbar hr-navbar px-3 px-lg-4">
  <div class="d-flex align-items-center">
    <!-- Mobile hamburger button -->
    <button
      class="btn btn-outline-secondary btn-sm me-3 d-lg-none"
      id="sidebar-toggle"
      type="button"
      aria-label="Toggle navigation menu"
      aria-expanded="false"
      aria-controls="hr-sidebar"
    >
      <i class="bi bi-list fs-5"></i>
    </button>

    <!-- Brand with Login-consistent Monogram -->
    <a class="navbar-brand me-4 d-flex align-items-center text-decoration-none" href="{% url 'accounts:dashboard_redirect' %}" title="SmartHR Home">
      <div class="d-flex align-items-center justify-content-center text-white rounded-3 me-2 shadow-xs"
           style="width: 36px; height: 36px; background: linear-gradient(135deg, #c59b27, #b8860b);">
        <i class="bi bi-layers-half fs-5"></i>
      </div>
      <span class="fw-bold tracking-tight fs-5" style="color: var(--text-primary); letter-spacing: -0.02em;">Smart<span style="color: var(--primary);">HR</span></span>
    </a>
  </div>

  <div class="d-flex align-items-center gap-2 gap-md-3">
    <!-- Light / Dark Mode Toggle Switcher -->
    <button
      id="theme-toggle"
      class="btn-theme-toggle"
      type="button"
      aria-label="Switch between light and dark mode"
      title="Toggle Light / Dark mode"
    >
      <i class="bi bi-sun-fill theme-icon-sun d-none fs-6 text-warning"></i>
      <i class="bi bi-moon-stars-fill theme-icon-moon fs-6"></i>
    </button>

    <!-- User Profile Chip -->
    <a href="{% url 'accounts:profile' %}" class="d-flex align-items-center text-decoration-none p-1 rounded-pill" title="View My Profile">
      <div class="avatar-circle me-2 fw-bold" style="width: 36px; height: 36px; font-size: 0.85rem;">
        {{ request.user.get_initials }}
      </div>
      <div class="d-none d-md-block text-start me-2">
        <div class="fw-semibold small lh-sm" style="color: var(--text-primary);">
          {{ request.user.get_full_name|default:request.user.email }}
        </div>
        <div class="d-flex align-items-center gap-1 mt-1">
          <span class="badge rounded-pill text-uppercase px-2"
                style="background-color: var(--primary-subtle); color: var(--primary); font-size: 0.65rem; letter-spacing: 0.05em; font-weight: 700;">
            {{ request.user.get_role_display }}
          </span>
        </div>
      </div>
    </a>

    <!-- Role Badge (visible on small screens where name is hidden) -->
    <span class="badge rounded-pill text-uppercase d-md-none me-1 px-2 py-1"
          style="background-color: var(--primary-subtle); color: var(--primary); font-size: 0.7rem; font-weight: 700;">
      {{ role|default:request.user.get_role_display }}
    </span>

    <!-- Logout -->
    <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1" title="Log out of system">
        <i class="bi bi-box-arrow-right"></i>
        <span class="d-none d-sm-inline">Logout</span>
      </button>
    </form>
  </div>
</nav>
