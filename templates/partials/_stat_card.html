<div class="hr-stat-card h-100">
  <div class="hr-stat-icon">
    {% if "bi-" in icon or "bi " in icon %}
      <i class="{{ icon }}"></i>
    {% else %}
      {{ icon }}
    {% endif %}
  </div>
  <div class="flex-grow-1 min-w-0">
    <div class="hr-stat-title text-truncate">{{ title }}</div>
    <div class="hr-stat-value">{{ value|default_if_none:"--" }}</div>
  </div>
</div>
